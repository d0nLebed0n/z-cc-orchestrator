name: thorough
description: |
  Полный цикл с финальной приёмкой: plan → implement → review (цикл пока
  APPROVE, лимит 3) → final (после выхода из цикла).
  Модели берутся из карты ролей Settings (role → model), а не хардкожены.
  Кросс-семейность enforced раннером (implement ≠ review по family).
steps: []  # без pre-loop шагов
post_steps:
  # post-loop: финальная приёмка после выхода из цикла
  - id: final
    role: final
    effort: medium
    budget:
      wall_time_sec: 600
      max_steps: 1
    depends_on: []
    target_paths: []
loop:
  steps:
    - id: plan
      role: plan
      effort: high
      budget:
        wall_time_sec: 900
        max_steps: 2
      depends_on: []
      target_paths: []

    - id: implement
      role: implement
      effort: high
      budget:
        wall_time_sec: 1500
        max_steps: 3
      depends_on: [plan]
      target_paths: []

    - id: review
      role: review
      effort: high
      budget:
        wall_time_sec: 900
        max_steps: 2
        max_session_min: 25
      depends_on: [implement]
      target_paths: []
  exit_on: review
  max_iterations: 3
  on_exhausted: hitl

name: default
description: |
  Базовый воркфлоу: имплементация → ревью.
  Модели берутся из карты ролей Settings (role → model), а не хардкожены.
  Кросс-семейность enforced раннером: implement ≠ review по family.
  Если нужна правка по замечаниям review — используйте `agentic` (цикл).
steps:
  - id: implement
    role: implement
    effort: medium
    budget:
      wall_time_sec: 1500
      max_steps: 3
    depends_on: []
    target_paths: []

  - id: review
    role: review
    effort: medium
    budget:
      wall_time_sec: 900
      max_steps: 2
      max_session_min: 25
    depends_on: [implement]
    target_paths: []

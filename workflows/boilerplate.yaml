name: boilerplate
description: |
  Массовый boilerplate: implement → review (низкий effort, дёшево).
  Модели берутся из карты ролей Settings (role → model), а не хардкожены.
steps:
  - id: generate
    role: implement
    effort: low
    budget:
      wall_time_sec: 1200
      max_steps: 2
    depends_on: []
    target_paths: []

  - id: review
    role: review
    effort: medium
    budget:
      wall_time_sec: 900
      max_steps: 2
      max_session_min: 25
    depends_on: [generate]
    target_paths: []

name: project-init
description: |
  Генерация контекста проекта (00-project/*.md) ролью architect.
  Запускается при открытии проекта через UI (кнопка «Открыть проект»).
  Модель берётся из карты ролей Settings (role: architect → model), а не хардкожена.
steps:
  - id: discover
    role: architect
    effort: high
    budget:
      wall_time_sec: 300
      max_steps: 1
      max_session_min: 5
    depends_on: []
    target_paths: []

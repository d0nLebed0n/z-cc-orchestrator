name: agentic
description: |
  Агентский цикл: plan → implement → review.
  Повторяет пока review не даст APPROVE (лимит 3 итерации, потом HITL).
  Модели берутся из карты ролей Settings (role → model), а не хардкожены.
steps: []  # только цикл, без pre-loop шагов
loop:
  steps:
    - id: plan
      role: plan
      effort: high
      budget:
        wall_time_sec: 900
        max_steps: 2
      depends_on: []
      target_paths: []

    - id: implement
      role: implement
      effort: medium
      budget:
        wall_time_sec: 1200
        max_steps: 2
      depends_on: [plan]
      target_paths: []

    - id: review
      role: review
      effort: medium
      budget:
        wall_time_sec: 900
        max_steps: 2
        max_session_min: 25
      depends_on: [implement]
      target_paths: []
  exit_on: review       # чей вердикт проверяем
  max_iterations: 3     # лимит кругов
  on_exhausted: hitl    # если APPROVE не получен → эскалация

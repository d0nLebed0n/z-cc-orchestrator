name: decomposed
description: |
  Декомпозиция: plan → fan-out implement (strong + local по threshold) →
  per-subtask review → финальная приёмка.
  Модели берутся из карты ролей Settings (role → model), а не хардкожены.
  fan_out agents: если не заданы — все non-architect, non-review модели из Settings.
  Каждая подзадача независимо ревьюится (review: true на fan_out-шаге).
complexity_threshold: 65
max_parallel: 3

steps:
  - id: plan
    role: plan
    effort: high
    budget: { wall_time_sec: 900, max_steps: 2 }
    depends_on: []

  - id: build
    fan_out: true
    from_plan: plan
    review: true       # каждая подзадача ревьюится (per-subtask, review-роль из Settings)
    role: implement
    depends_on: [plan]
    budget: { wall_time_sec: 1200, max_steps: 2 }

  - id: review
    role: review
    effort: medium
    budget: { wall_time_sec: 900, max_steps: 2, max_session_min: 25 }
    depends_on: [build]

  - id: final
    role: final
    effort: high
    budget: { wall_time_sec: 900, max_steps: 2 }
    depends_on: [review]

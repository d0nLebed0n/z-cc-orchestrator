name: ui
description: |
  Фронтенд-задачи: implement (высокий effort — UI-код объёмный) → review.
  Модели берутся из карты ролей Settings (role → model), а не хардкожены.
steps:
  - id: implement
    role: implement
    effort: high
    budget:
      wall_time_sec: 1800
      max_steps: 3
    depends_on: []
    target_paths: []

  - id: review
    role: review
    effort: medium
    budget:
      wall_time_sec: 900
      max_steps: 2
      max_session_min: 25
    depends_on: [implement]
    target_paths: []
